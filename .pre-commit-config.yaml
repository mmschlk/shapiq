repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict

  # the version of ruff in uv.lock, so that the hook and `uv run ruff` report the same
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --no-cache]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: ty-tests
        name: ty (test_metrics)
        entry: >-
          uv run ty check
          --config 'src.include=["tests/shapiq_benchmark/test_metrics.py"]'
          --config 'src.exclude=[]'
          --no-force-exclude
          tests/shapiq_benchmark/test_metrics.py
        language: system
        pass_filenames: false
        always_run: true

      # the format of the bibliography (docs/source/references.bib), on changed .bib files only
      - id: format-bib
        name: format-bib
        entry: python docs/format_bib.py
        language: python
        files: \.bib$
