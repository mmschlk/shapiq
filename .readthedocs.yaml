version: 2

# specify that we only build html
formats: []

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Use uv to speed up the build
    # https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv
    install:
      # The examples run on the CPU: the locked packages without the CUDA libraries of torch
      # (nvidia-*, triton; about 4 GB, most of the install time), and torch from its CPU index.
      - uv export --frozen --no-dev --all-extras --group docs --no-emit-project --no-hashes --no-annotate --no-header --output-file requirements-docs.txt
      - sed -i -E '/^(nvidia-|triton==)/d' requirements-docs.txt
      - uv pip install --torch-backend cpu -r requirements-docs.txt
      - uv pip install --no-deps -e .
    build:
      html:
      - uv run --no-sync sphinx-build -b html docs/source $READTHEDOCS_OUTPUT/html
