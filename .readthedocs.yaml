version: 2

# specify that we only build html
formats: []

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Use uv to speed up the build
    # https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
    pre_create_environment:
      # the start of the build, for the timeout of sphinx-build below, and the machine it runs on
      - date +%s > /tmp/build-start && nproc && free -g
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv
    install:
      # The examples run on the CPU: the locked packages without the CUDA libraries of torch
      # (nvidia-*, triton; about 4 GB, most of the install time), and torch from its CPU index.
      # --no-deps installs exactly that list (XGBoost would pull in NCCL, a GPU library, again).
      - uv export --frozen --no-dev --all-extras --group docs --no-emit-project --no-hashes --no-annotate --no-header --output-file requirements-docs.txt
      - sed -i -E '/^(nvidia-|triton==)/d' requirements-docs.txt
      - uv pip install --torch-backend cpu --no-deps -r requirements-docs.txt
      - uv pip install --no-deps -e .
    build:
      html:
      # Stop 20 s before Read the Docs ends the build (900 s): a build that stops by itself saves
      # its log, which then shows where it spent its time.
      - timeout $(( 880 - $(date +%s) + $(cat /tmp/build-start) )) uv run --no-sync sphinx-build -b html docs/source $READTHEDOCS_OUTPUT/html
