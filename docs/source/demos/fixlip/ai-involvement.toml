# What AI did on this page, part by part, for the line beside the text (see ai-involvement.rst).
# Levels: 0 Handmade, 1 Polished, 2 Co-written, 3 Vetted, 4 Guided, 5 Autopilot
# (_data/ai-involvement.toml). Self-reported. Change a level here when it no longer holds.

[page]
level = 3
summary = "Claude wrote most of this page from the FIxLIP paper. Max directed it in rounds and reviewed it with about 70 comments. The introduction is his own text."
written = "Claude, directed by Max"
models = ["Claude Fable 5.2", "Claude Opus 5.5"]
checked = 2026-11-17
note = "Max is still reviewing the page. The levels give its state on 17 Nov 2026."
# the panel to try views and colors, for review only (remove before merging into main)
mixer = true

# what every part below has unless it says otherwise
[defaults]
level = 3
written = "Claude, from the FIxLIP paper"
models = ["Claude Fable 5.2"]
human = "Max set the structure, the titles and the style. He asked for changes in rounds and in about 70 comments on the text."
sources = "Baniecki et al. (2025)"
checked = 2026-11-17

[[parts]]
