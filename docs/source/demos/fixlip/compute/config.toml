crop = [128, 0, 552, 424]
caption = "a giraffe has its front legs spread to bend down for a drink of water at a pond."
title = "A giraffe drinking at a pond, a dead tree behind it"
alt = "A giraffe spreads its front legs to drink at a pond; a dead tree stands in the background."
excerpt = [
    "Drinking is the most dangerous moment of a giraffe's day. In the dry season, the last pools of the park draw every animal for miles, and a single photo shows why it takes so long:",
    "Behind it, the bare branches of a dead tree reach out of the bush, and the rest of the herd keeps watch from a safe distance until it is their turn to drink.",
]
