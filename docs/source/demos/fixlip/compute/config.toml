# The FIxLIP demo: its models, its photos with their captions, and the texts it shows.
#
# explain.py reads the models and the photos (the COCO photo, its crop and its caption) and computes
# the explanations; pack.py writes them into ../assets/data.js, with the texts the demo shows.

# how the explanations were computed, as the demo says it (explain.py's budget)
method = "ProxySHAP from 10,000 coalitions"
budget = 10_000

# The models, as FIxLIP's figures show them: ViT-B/32, one player per image patch.
[[models]]
id = "siglip2"
label = "SigLIP 2"
detail = "ViT-B/32"
checkpoint = "google/siglip2-base-patch32-256"  # 256 x 256 pixels: 8 x 8 patches
grid = 8

[[models]]
id = "clip"
label = "CLIP"
detail = "ViT-B/32"
checkpoint = "openai/clip-vit-base-patch32"  # 224 x 224 pixels: 7 x 7 patches
grid = 7

# The photos, in the demo's order: COCO photos (all of the train2017 split) and the captions of
# FIxLIP's figures. ``crop`` is the square of the photo that the models and the demo see, as
# (left, top, right, bottom) in pixels. The other texts are what the demo shows: the title and the
# alt text of the photo, the excerpt (an invented text around the caption, shown without an
# explanation) and the credit of the photo.

[[photos]]
id = "elephant"
coco = 46761
crop = [76, 0, 503, 427]
caption = "a small elephant standing next to a white bird."
title = "A baby elephant and an egret"
alt = "A baby elephant in tall grass, looking at a small white egret on the left."
excerpt = [
    "The rains came late that year, and the herd stayed near the waterhole for weeks. While the adults dozed in the afternoon heat, the youngest wandered off into the tall grass, and for a while, all the camera saw was",
    "Neither of them seemed to mind the other. A few minutes later, the bird took off, and the calf trotted back to its mother, ears flapping, as if nothing had happened at all.",
]
credit.title = "“Baby Elephant with Egret”"
credit.author = "Wilson Kwo"
credit.url = "https://www.flickr.com/photos/43884348@N08/7035223219"
credit.license = "CC BY-NC-SA 2.0"
credit.licenseUrl = "https://creativecommons.org/licenses/by-nc-sa/2.0/"

[[photos]]
