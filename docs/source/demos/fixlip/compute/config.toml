credit.author = "Tim Ellis"
credit.url = "https://www.flickr.com/photos/14113765@N00/249234674"
credit.license = "CC BY-NC 2.0"
credit.licenseUrl = "https://creativecommons.org/licenses/by-nc/2.0/"

