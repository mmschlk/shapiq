name: Benchmark Pages

on:
  workflow_dispatch:
  push:
    branches: [main, benchmark]
    paths:
      - 'benchmark/site/**'
      - '.github/workflows/benchmark-pages.yml'
      - 'benchmark/fetch_report.py'

# Opt in per repository; forks and unrelated Pages sites stay untouched.
permissions:
  contents: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.BENCHMARK_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and validate public snapshot
        run: |
          python benchmark/fetch_report.py benchmark/site/data-source.json "$RUNNER_TEMP/benchmark-site"
          cp benchmark/site/{index.html,app.js,records.js,partitions.js,partition-details.js,query.js,query-worker.js,partition-client.js,partition-download.js,partition-about.js,charts.js,protocol.js,style.css,shapiq.svg,methods.js,about.html,about.css,about.js} "$RUNNER_TEMP/benchmark-site/"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/benchmark-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
