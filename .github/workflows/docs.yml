# Builds the documentation with every gallery example, but only on request: a reviewer adds the
# label "build docs" to a pull request (the build then reruns on every push while the label is on),
# or someone runs the workflow from the Actions tab. Any Sphinx warning fails the build.
name: Documentation
on:
    pull_request:
        types: [labeled, synchronize, reopened]
    workflow_dispatch:
jobs:
    build_docs:
        name: Build Documentation
        # a "labeled" event builds only for the docs label itself, not when other labels are added
        if: >-
            github.event_name == 'workflow_dispatch'
            || (github.event.action == 'labeled' && github.event.label.name == 'build docs')
            || (github.event.action != 'labeled'
                && contains(github.event.pull_request.labels.*.name, 'build docs'))
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        concurrency:
            group: docs-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up Python and uv
                uses: astral-sh/setup-uv@v7
                with:
                    python-version: "3.12"
                    enable-cache: true
            # the examples download datasets, Imagenette and pretrained models: keep them
            -   name: Cache the examples' data and models
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.cache/shapiq
                        ~/.cache/huggingface
                        ~/.cache/torch
                        ~/scikit_learn_data
                    key: docs-data-${{ runner.os }}-${{ hashFiles('examples/**/*.py') }}
                    restore-keys: docs-data-${{ runner.os }}-
            # the same install as Read the Docs (CPU-only torch, see the script)
            -   name: Install dependencies
                run: |
                    uv venv
                    bash docs/install_dependencies.sh
            -   name: Build documentation
                run: uv run --no-sync sphinx-build -W --keep-going -b html docs/source docs/build/html
            -   name: Upload the built documentation
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@v7
                with:
                    name: documentation
                    path: docs/build/html
                    retention-days: 7
                    if-no-files-found: ignore
